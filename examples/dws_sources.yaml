# DWS Data Sources Configuration
# Each key is an alias that matches the database name in Excel FQNs.
# The ``database`` field is the actual database name to connect to.
# The alias and actual database name are decoupled.
#
# Usage:
#   data-diff run --excel mapping.xlsx --config dws_sources.yaml

sources:
  edw:
    host: 10.0.1.100
    port: 8000
    database: edw_prod
    user: admin
    password: changeme

  ods:
    host: 10.0.2.200
    port: 8000
    database: ods_staging
    user: readonly
    password: changeme
